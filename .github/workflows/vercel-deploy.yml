name: Vercel Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ secrets.VERCEL_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Inject site config
        run: node scripts/inject-config.mjs
        env:
          SITE_LOCATION:      ${{ vars.SITE_LOCATION }}
          SITE_STATUS:        ${{ vars.SITE_STATUS }}
          SITE_WORKING_ON:    ${{ vars.SITE_WORKING_ON }}
          SITE_OPEN_TO:       ${{ vars.SITE_OPEN_TO }}
          SITE_FAV_COLOR:     ${{ vars.SITE_FAV_COLOR }}
          SITE_EMAIL:         ${{ vars.SITE_EMAIL }}
          SITE_ROLE:          ${{ vars.SITE_ROLE }}
          SITE_TAGLINE:       ${{ vars.SITE_TAGLINE }}
          SITE_NOW_1:         ${{ vars.SITE_NOW_1 }}
          SITE_NOW_2:         ${{ vars.SITE_NOW_2 }}
          SITE_NOW_3:         ${{ vars.SITE_NOW_3 }}
          SITE_NOW_4:         ${{ vars.SITE_NOW_4 }}

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Link to arlingkin.vercel.app project
        run: vercel link --yes --project arlingkin --token ${{ secrets.VERCEL_TOKEN }}

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token ${{ secrets.VERCEL_TOKEN }}

      - name: Build project artifacts
        run: vercel build --prod --token ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (production)
        run: vercel deploy --prebuilt --prod --yes --token ${{ secrets.VERCEL_TOKEN }}