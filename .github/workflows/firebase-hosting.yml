name: Firebase Hosting Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    env:
      TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - id: check
        run: |
          if [ -n "$TOKEN" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "ready=false" >> "$GITHUB_OUTPUT"; fi

  deploy:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Inject site config
        run: node scripts/inject-config.mjs
        env:
          SITE_LOCATION:      ${{ vars.SITE_LOCATION }}
          SITE_STATUS:        ${{ vars.SITE_STATUS }}
          SITE_WORKING_ON:    ${{ vars.SITE_WORKING_ON }}
          SITE_OPEN_TO:       ${{ vars.SITE_OPEN_TO }}
          SITE_EMAIL:         ${{ vars.SITE_EMAIL }}
          SITE_ROLE:          ${{ vars.SITE_ROLE }}
          SITE_TAGLINE:       ${{ vars.SITE_TAGLINE }}
          SITE_NOW_1:         ${{ vars.SITE_NOW_1 }}
          SITE_NOW_2:         ${{ vars.SITE_NOW_2 }}
          SITE_NOW_3:         ${{ vars.SITE_NOW_3 }}
          SITE_NOW_4:         ${{ vars.SITE_NOW_4 }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
